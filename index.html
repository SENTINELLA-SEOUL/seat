<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면에 딱 맞추고 확대/축소를 방지하는 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서비스 종료</title>
    
    <!-- Tailwind CSS (스타일링 용도) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 기본 여백 제거 및 스크롤 방지 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: repeating-linear-gradient(
                to right,
                #1a1a1a,
                #1a1a1a 40px,
                #4d1a1a 40px,
                #4d1a1a 80px
            );
        }

        /* 텍스트 서서히 나타나는 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in-text {
            animation: fadeIn 1.5s ease-out forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center h-full w-full">

    <!-- 정중앙 텍스트 컨테이너 -->
    <div class="text-center px-4 fade-in-text">
        <h1 class="text-white text-6xl sm:text-7xl md:text-8xl font-black tracking-tight" style="word-break: keep-all;">
            서비스 종료
        </h1>
    </div>

</body>
</html>
